---
- name: Install k3s worker node
  hosts: all
  become: true

  tasks:
    - name: Download k3s install script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'

    - name: Install k3s agent and join cluster
      shell: |
        K3S_URL="{{ server }}" \
        K3S_TOKEN="{{ token }}" \
        /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s-agent

    - name: Enable and start k3s-agent service
      systemd:
        name: k3s-agent
        enabled: true
        state: started
